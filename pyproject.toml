[project]
name = "multi-agent-research"
version = "0.1.0"
description = "First step to hack2thon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "langchain>=1.3.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.4",
    "langgraph-cli[inmem]>=0.4.27",
    "langgraph-supervisor>=0.0.31",
    "langsmith>=0.8.8",
    "python-dotenv>=1.2.2",
    "langchain-community>=0.3.0",
    "duckduckgo-search>=6.0.0",
    "ddgs>=9.14.4",
    "textual>=8.2.8",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]
